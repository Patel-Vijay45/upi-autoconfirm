name: Deploy

# Push to main → tests → staging.  "Run workflow" (manual) → tests → staging → production.
# Setup steps: docs/DEPLOY.md. Each GitHub environment ("staging", "production") needs the secrets
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and AUTOCONFIRM_ADMIN_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  staging:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/deploy/deploy.mjs --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTOCONFIRM_ADMIN_TOKEN: ${{ secrets.AUTOCONFIRM_ADMIN_TOKEN }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          DASHBOARD_PUBLIC_URL: ${{ vars.DASHBOARD_PUBLIC_URL }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}

  production:
    needs: staging
    # Production only goes out when you press "Run workflow" (works on every GitHub plan). On a public repo or a
    # paid plan you can also add "Required reviewers" to the production environment for a second check.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/deploy/deploy.mjs --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTOCONFIRM_ADMIN_TOKEN: ${{ secrets.AUTOCONFIRM_ADMIN_TOKEN }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          DASHBOARD_PUBLIC_URL: ${{ vars.DASHBOARD_PUBLIC_URL }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
