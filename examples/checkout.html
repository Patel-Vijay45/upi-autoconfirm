<!doctype html>
<!--
  AutoConfirm checkout: two ways.
  A) Drop-in widget (recommended): ~10 lines.
  B) No widget: build your own buttons from the intent your server returned.
  Your SERVER creates the intent with the secret key; the browser only gets intent.id / links.
-->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Pay</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 2rem auto; padding: 0 1rem; }
		.amt { font-size: 2.4rem; font-weight: 800; }
		.btn { display: block; width: 100%; margin: .5rem 0; padding: .9rem; border-radius: 999px; border: 0; font-size: 1rem; font-weight: 700; text-align: center; text-decoration: none; background: #111; color: #fff; }
		.ghost { background: #fff; color: #111; border: 2px solid #111; }
		.status { margin-top: 1rem; font-weight: 700; }
		.qr svg { width: 12rem; height: auto; }
	</style>
</head>
<body>
	<!-- ===== A) Drop-in widget ===== -->
	<script src="https://pay.example.com/v1/checkout.js" defer></script>
	<button class="btn" id="pay-widget">Pay with UPI (widget)</button>
	<script>
		document.getElementById('pay-widget').onclick = async () => {
			const { intentId } = await fetch('/api/create-upi-payment', {
				method: 'POST',
				headers: { 'content-type': 'application/json' },
				body: JSON.stringify({ orderId: 'A-31-7' })
			}).then((r) => r.json());
			AutoConfirm.open({
				key: 'pk_test_xxx',
				intent: intentId,
				lang: 'gu',
				onPaid: (pi) => (location.href = '/thank-you?order=' + encodeURIComponent(pi.order_id)),
				onExpired: () => alert('Time over. Please try again.')
			});
		};
	</script>

	<hr />

	<!-- ===== B) No widget: your own UI from the intent JSON ===== -->
	<div id="own-ui" hidden>
		<p>Pay exactly</p>
		<p class="amt">₹<span id="amt"></span></p>
		<small>The extra paise help us confirm your payment automatically.</small>
		<a class="btn" id="gpay">Pay with Google Pay</a>
		<a class="btn" id="phonepe">Pay with PhonePe</a>
		<a class="btn" id="paytm">Pay with Paytm</a>
		<a class="btn ghost" id="anyupi">Other UPI app</a>
		<div class="qr" id="qr"></div>
		<button class="btn ghost" id="paid">I have paid</button>
		<p class="status" id="status"></p>
	</div>
	<button class="btn" id="pay-own">Pay with UPI (own UI)</button>
	<script>
		document.getElementById('pay-own').onclick = async () => {
			// Your server returns the intent fields it got from POST /v1/payment_intents
			const pi = await fetch('/api/create-upi-payment?full=1', {
				method: 'POST',
				headers: { 'content-type': 'application/json' },
				body: JSON.stringify({ orderId: 'A-31-7' })
			}).then((r) => r.json());
			document.getElementById('own-ui').hidden = false;
			document.getElementById('amt').textContent = pi.display_amount;
			document.getElementById('gpay').href = pi.upi.apps.gpay;
			document.getElementById('phonepe').href = pi.upi.apps.phonepe;
			document.getElementById('paytm').href = pi.upi.apps.paytm;
			document.getElementById('anyupi').href = pi.upi.uri;
			document.getElementById('qr').innerHTML = pi.upi.qr_svg; // SVG generated by the server
			const status = document.getElementById('status');

			document.getElementById('paid').onclick = () => {
				fetch(`https://api.example.com/v1/public/payment_intents/${pi.id}/claim`, {
					method: 'POST',
					headers: { Authorization: 'Bearer pk_test_xxx' }
				});
				status.textContent = 'Checking payment… ⏳';
			};

			// Live status with polling fallback
			const check = async () => {
				const s = await fetch(`https://api.example.com/v1/public/payment_intents/${pi.id}/status`, {
					headers: { Authorization: 'Bearer pk_test_xxx' }
				}).then((r) => r.json());
				if (s.status === 'paid') {
					status.textContent = 'Payment received ✓';
					return (location.href = '/thank-you?order=A-31-7');
				}
				if (s.status === 'expired') return (status.textContent = 'Not confirmed. If money was deducted, show this screen at the counter.');
				setTimeout(check, 3000);
			};
			check();
			// Customers come back from the UPI app: re-check immediately
			addEventListener('pageshow', check);
		};
	</script>
</body>
</html>
